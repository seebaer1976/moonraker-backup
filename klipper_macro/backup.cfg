# Optional Klipper macros for moonraker-backup
# [include backup.cfg]  in printer.cfg after component is installed

[gcode_macro BACKUP_CONFIG]
description: ZIP-Backup der Config über Moonraker anlegen
gcode:
    {action_call_remote_method("backup_create", note="from-macro")}
    RESPOND MSG="Config-Backup gestartet (siehe Moonraker / backups)"
