# =============================================================================
# moonraker-backup – Beispiel für moonraker.conf
# In ~/printer_data/config/moonraker.conf übernehmen oder per [include] laden.
# =============================================================================

# --- Komponente aktivieren (lädt backup.py aus moonraker/components/) ---
[backup]
# source_path: ~/printer_data/config
# storage_path: ~/printer_data/backups
# max_backups: 20
# exclude: .git,*.pyc,__pycache__,.DS_Store
# name_prefix: config-backup
# block_during_print: True
# backup_before_update: True

# --- Updates über Mainsail/Fluidd ---
# origin auf DEIN GitHub-Repo anpassen!
[update_manager moonraker-backup]
type: git_repo
path: ~/moonraker-backup
origin: https://github.com/DEIN_USER/moonraker-backup.git
primary_branch: main
managed_services: moonraker
install_script: scripts/install.sh
